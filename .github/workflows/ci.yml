name: Scrypt CV ATS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: |
          python -c "from app import extract_pdf_text, CVData, JobTarget, CVEnhancer, generate_ats_docx, generate_ats_html"
          echo "All imports OK"

      - name: Test CLI help
        run: |
          python ats_converter.py --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flake8 black
      - run: flake8 app/ ats_converter.py --max-line-length=100
      - run: black --check app/ ats_converter.py
